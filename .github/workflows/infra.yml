# Infrastruktur von prod (deploy/main.bicep) in der Resource Group rg-tauchplaetze-prod. Nur manuell.
# Standard what-if: zeigt die geplanten Änderungen. deploy wendet sie an, erst nach Freigabe durch den Required Reviewer im Environment prod.
# Resource Group, Rollen, Variablen und Secrets: doc/go-live.md.

name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: what-if zeigt nur die Änderungen, deploy wendet sie an
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-prod
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-tauchplaetze-prod
  APP_NAME: app-tauchplaetze-prod
  APP_URL: ${{ vars.PUBLIC_BASE_URL || 'https://app-tauchplaetze-prod.azurewebsites.net' }}
  # Secrets statt Variablen: Die Logs eines öffentlichen Repositorys sind öffentlich, Variablen maskiert GitHub nicht.
  SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
  SQL_ADMIN_OBJECT_ID: ${{ secrets.SQL_ADMIN_OBJECT_ID }}
  SQL_ADMIN_PRINCIPAL_TYPE: ${{ vars.SQL_ADMIN_PRINCIPAL_TYPE }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  what-if:
    runs-on: ubuntu-latest
    # Ohne Freigabe, nur lesend. Das Environment liefert die OIDC-Anmeldung, eine Credential für den Branch braucht es so nicht.
    environment: prod-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "tauchplaetze-${{ github.run_number }}" \
            --template-file deploy/main.bicep \
            --parameters deploy/main.bicepparam \
            --no-pretty-print --result-format ResourceIdOnly --output json > whatif.json
          {
            echo "## What-if"
            echo
            jq -r '.changes[] | "- \(.changeType): \(.resourceId | split("/providers/") | last)"' whatif.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout
        if: always()
        run: az logout

  deploy:
    if: inputs.action == 'deploy'
    needs: what-if
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "tauchplaetze-${{ github.run_number }}" \
            --template-file deploy/main.bicep \
            --parameters deploy/main.bicepparam \
            --output none

      # Neue App Settings lösen einen Neustart aus, der mitten im Umstellen starten kann (24.10.2026: Impressum ohne Anschrift,
      # Platz ohne Text bis zum nächsten Neustart). Ein gezielter Neustart danach lädt alles sauber und leert den Output Cache.
      - name: App neu starten
        run: |
          if az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv > /dev/null 2>&1; then
            az webapp restart --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"
            echo "restarted=true" >> "$GITHUB_ENV"
          fi

      - name: Warten auf die App
        if: env.restarted == 'true'
        run: |
          sleep 30
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL/alive" || echo 000)
            echo "/alive attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::App antwortet nach dem Neustart nicht (letzter HTTP $code)"
          exit 1

      - name: Rauchtest
        if: env.restarted == 'true'
        run: .github/scripts/smoke.sh

      - name: Logout
        if: always()
        run: az logout
