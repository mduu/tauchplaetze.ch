# Infrastruktur von prod (deploy/main.bicep) in der Resource Group rg-tauchplaetze-prod. Nur manuell.
# Standard what-if: zeigt die geplanten Änderungen. deploy wendet sie an, erst nach Freigabe durch den Required Reviewer im Environment prod.
# Resource Group, Rollen, Variablen und Secrets: doc/go-live.md.

name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: what-if zeigt nur die Änderungen, deploy wendet sie an
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-prod
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-tauchplaetze-prod
  SQL_ADMIN_LOGIN: ${{ vars.SQL_ADMIN_LOGIN }}
  SQL_ADMIN_OBJECT_ID: ${{ vars.SQL_ADMIN_OBJECT_ID }}
  SQL_ADMIN_PRINCIPAL_TYPE: ${{ vars.SQL_ADMIN_PRINCIPAL_TYPE }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "tauchplaetze-${{ github.run_number }}" \
            --template-file deploy/main.bicep \
            --parameters deploy/main.bicepparam \
            --no-pretty-print --result-format ResourceIdOnly --output json > whatif.json
          {
            echo "## What-if"
            echo
            jq -r '.changes[] | "- \(.changeType): \(.resourceId | split("/providers/") | last)"' whatif.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logout
        if: always()
        run: az logout

  deploy:
    if: inputs.action == 'deploy'
    needs: what-if
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "tauchplaetze-${{ github.run_number }}" \
            --template-file deploy/main.bicep \
            --parameters deploy/main.bicepparam \
            --output none

      - name: Logout
        if: always()
        run: az logout
