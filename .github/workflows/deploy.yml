# Deploy der App auf prod, nach einer grünen CI auf main (infrastructure.md, CI/CD).
# Environment prod-app: ohne Freigabe (Entscheid Marc, 20.10.2026), nur vom Branch main.
# Die App migriert die Datenbank beim Start und legt fehlende Stammdaten an (Database__PrepareOnStartup).
# Läuft erst, wenn die Repository-Variable AZURE_CLIENT_ID gesetzt ist (doc/go-live.md, OIDC).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  APP_NAME: app-tauchplaetze-prod
  RESOURCE_GROUP: rg-tauchplaetze-prod
  # Nach restrictToCloudflare erreicht nur Cloudflare die App: dann die Variable PUBLIC_BASE_URL setzen (doc/go-live.md).
  APP_URL: ${{ vars.PUBLIC_BASE_URL || 'https://app-tauchplaetze-prod.azurewebsites.net' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    # `branches: [main]` prüft nur den Namen des Branches. Ein Pull Request aus einem Fork mit einem Branch «main» darf nicht deployen.
    if: >-
      vars.AZURE_CLIENT_ID != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: prod-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Der Commit landet in der Version der App. /alive nennt ihn im Header X-Build, der Health-Schritt wartet darauf.
      - name: Publish
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: dotnet publish src/Tauchplaetze.Web/Tauchplaetze.Web.csproj --configuration Release --output ./publish "-p:SourceRevisionId=$BUILD_SHA"

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Vor dem ersten Infra-Deploy gibt es die Web App noch nicht. Dann überspringt der Job Deploy und Health, statt rot zu werden.
      - name: Web App vorhanden?
        id: app
        run: |
          if az webapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query id -o tsv > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web App $APP_NAME gibt es noch nicht (infra.yml zuerst). Deploy übersprungen."
          fi

      # Ein Neustart bricht einen laufenden Prognose-Lauf ab (24.10.2026). Darum zuerst warten, bis keiner läuft.
      - name: Auf Prognose-Lauf warten
        if: steps.app.outputs.exists == 'true'
        run: .github/scripts/wait-for-forecast.sh

      - name: Deploy
        if: steps.app.outputs.exists == 'true'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./publish

      # Mit Run from Package meldet der Deploy Erfolg, bevor die neue Version läuft. Darum zuerst warten, bis /alive den neuen Commit nennt.
      # /alive prüft die App, /de zusätzlich die Datenbank. /health/ready (Datenbank und Prognose-Lauf jünger als 30 h) nur als Warnung:
      # Nach dem ersten Deploy gibt es noch keinen Lauf, und ein voller Lauf dauert rund 25 Minuten.
      - name: Health
        if: steps.app.outputs.exists == 'true'
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          running=""
          for i in $(seq 1 60); do
            running=$(curl -s -o /dev/null -D - --max-time 20 "$APP_URL/alive" | tr -d '\r' | awk 'tolower($1)=="x-build:" {print $2}' || true)
            echo "/alive attempt $i: X-Build ${running:-none}, expected $BUILD_SHA"
            [ "$running" = "$BUILD_SHA" ] && break
            sleep 10
          done
          if [ "$running" != "$BUILD_SHA" ]; then
            echo "::error::Neue Version läuft nicht: /alive nennt ${running:-keinen Commit} statt $BUILD_SHA (10 Minuten gewartet)"
            exit 1
          fi
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$APP_URL$1" || echo 000)
              echo "$1 attempt $i: HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 15
            done
            echo "::error::$1 is not healthy (last HTTP $code)"
            return 1
          }
          check /alive
          check /de
          ready=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$APP_URL/health/ready" || echo 000)
          if [ "$ready" != "200" ]; then
            echo "::warning::/health/ready answers HTTP $ready (no recent forecast run or database problem)"
          fi

      - name: Rauchtest
        if: steps.app.outputs.exists == 'true'
        run: .github/scripts/smoke.sh

      - name: Logout
        if: always()
        run: az logout
