# Deploy der App auf prod, nach einer grünen CI auf main (infrastructure.md, CI/CD).
# Environment prod-app: ohne Freigabe (Entscheid Marc, 20.10.2026), nur vom Branch main.
# Die App migriert die Datenbank beim Start und legt fehlende Stammdaten an (Database__PrepareOnStartup).
# Läuft erst, wenn die Repository-Variable AZURE_CLIENT_ID gesetzt ist (doc/go-live.md, OIDC).

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  APP_NAME: app-tauchplaetze-prod
  # Nach restrictToCloudflare erreicht nur Cloudflare die App: dann die Variable PUBLIC_BASE_URL setzen (doc/go-live.md).
  APP_URL: ${{ vars.PUBLIC_BASE_URL || 'https://app-tauchplaetze-prod.azurewebsites.net' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    # `branches: [main]` prüft nur den Namen des Branches. Ein Pull Request aus einem Fork mit einem Branch «main» darf nicht deployen.
    if: >-
      vars.AZURE_CLIENT_ID != '' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: prod-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Tauchplaetze.Web/Tauchplaetze.Web.csproj --configuration Release --output ./publish

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          package: ./publish

      # /alive prüft die App, /de zusätzlich die Datenbank.
      - name: Health
        run: |
          check() {
            for i in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$APP_URL$1" || echo 000)
              echo "$1 attempt $i: HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 15
            done
            echo "::error::$1 is not healthy (last HTTP $code)"
            return 1
          }
          check /alive
          check /de

      - name: Logout
        if: always()
        run: az logout
