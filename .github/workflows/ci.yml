name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Tauchplaetze.slnx

      - name: Build
        run: dotnet build src/Tauchplaetze.slnx --no-restore --configuration Release

      # Die SQL-Tests starten SQL Server mit Testcontainers. Docker ist auf dem Runner vorhanden. In der CI wird nie übersprungen.
      - name: Test
        run: dotnet test --solution src/Tauchplaetze.slnx --no-build --configuration Release
